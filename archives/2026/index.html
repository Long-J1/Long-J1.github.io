<script>
(function () {
  var ta = document.getElementById('fbText');
  if (!ta) return;                       // 不在反馈页，什么都不做
  var tip = document.getElementById('fbTip');
  var copyBtn = document.getElementById('fbCopy');
  var clearBtn = document.getElementById('fbClear');

  function say(text, kind) {
    if (!tip) return;
    tip.textContent = text;
    tip.className = 'fb-tip' + (kind ? ' ' + kind : '');
    if (kind) setTimeout(function () { tip.className = 'fb-tip'; }, 4000);
  }

  copyBtn.addEventListener('click', function () {
    var v = ta.value.trim();
    if (!v) { say('先写点什么吧～', 'err'); ta.focus(); return; }
    var done = function () { say('已复制，粘贴给我就行', 'ok'); };
    var fail = function () {
      ta.select();
      say('自动复制被挡了，已帮你选中，按 Ctrl+C 复制', 'err');
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(v).then(done).catch(fail);
    } else {
      try {
        ta.focus(); ta.select();
        if (document.execCommand('copy')) { done(); ta.setSelectionRange(0, 0); }
        else fail();
      } catch (e) { fail(); }
    }
  });

  clearBtn.addEventListener('click', function () {
    ta.value = ''; say('已清空'); ta.focus();
  });
})();
</script>

  <div id="bgm-bar">
    <button id="bgm-toggle" title="播放 / 暂停">♪</button>
    <span id="bgm-title" title="正在播放：方大同《天气先生》">天气先生 - 方大同</span>
    <button id="bgm-next" title="下一首">⏭</button>

  <audio id="bgm" loop preload="none"></audio>
  <script>
  (function () {
    // 播放列表：以后加歌只往这里塞 {src, title}
    var TRACKS = [
      { src: '/music/weatherman.mp3', title: '天气先生 - 方大同' },
      { src: '/music/christmas-star.mp3', title: '圣诞星 - 周杰伦' }
    ];
    var K = { paused: 'pai_bgm_paused', pos: 'pai_bgm_pos', vol: 'pai_bgm_vol', idx: 'pai_bgm_idx' };
    var a = document.getElementById('bgm'),
        toggle = document.getElementById('bgm-toggle'),
        nextBtn = document.getElementById('bgm-next'),
        volEl = document.getElementById('bgm-vol'),
        titleEl = document.getElementById('bgm-title');
    var idx = parseInt(localStorage.getItem(K.idx) || '0', 10) || 0;
    idx = ((idx % TRACKS.length) + TRACKS.length) % TRACKS.length;
    var paused = localStorage.getItem(K.paused) === '1';
    var savedPos = parseFloat(localStorage.getItem(K.pos) || '0') || 0;
    var needSeek = false, seekTries = 0, lastSave = 0;

    // 音量：读记忆，默认 0.8
    var v = parseFloat(localStorage.getItem(K.vol));
    if (isNaN(v)) v = 0.8;
    a.volume = v; volEl.value = v;

    function loadTrack(i, keepPos) {
      idx = ((i % TRACKS.length) + TRACKS.length) % TRACKS.length;
      localStorage.setItem(K.idx, String(idx));
      if (!keepPos) { savedPos = 0; localStorage.setItem(K.pos, '0'); }
      needSeek = keepPos && savedPos > 0.5;
      seekTries = 0;
      a.src = TRACKS[idx].src;
      titleEl.textContent = TRACKS[idx].title;
      titleEl.title = '正在播放：' + TRACKS[idx].title;
    }
    loadTrack(idx, true);

    function savePos() {
      if (a.currentTime > 0 && !isNaN(a.currentTime)) {
        localStorage.setItem(K.pos, String(a.currentTime));
        lastSave = Date.now();
      }
    }
    function sync() {
      var playing = !a.paused;
      toggle.textContent = playing ? '♫' : '♪';
      toggle.title = playing ? '暂停（位置会记住，换页/刷新接着放）' : '播放（从上次位置接着放）';
      if (playing) toggle.classList.remove('needs-you');
    }

    function trySeek() {
      // 恢复播放位置：尝试后必须确认真的落位，被浏览器夹回0就重试（最多5次）
      if (!needSeek || seekTries >= 5 || !(savedPos > 0.5)) { needSeek = false; return; }
      if (isFinite(a.duration) && savedPos >= a.duration) { needSeek = false; return; }
      seekTries++;
      try { a.currentTime = savedPos; } catch (e) {}
    }
    a.addEventListener('loadedmetadata', trySeek);
    a.addEventListener('canplay', trySeek);
    // 落位守卫：手机浏览器（微信 X5 等）常在 metadata/canplay 时静默丢弃 seek，
    // 播放已开始却还漂在 0 秒 → 换页"从头重放"。playing 后轮询校验，偏差>3s 强制拉回。
    var guardTimer = null;
    function startSeekGuard() {
      if (guardTimer || !needSeek || !(savedPos > 0.5)) return;
      var tries = 0;
      guardTimer = setInterval(function () {
        var ok = !needSeek || tries >= 8 ||
          (isFinite(a.currentTime) && Math.abs(a.currentTime - savedPos) < 3);
        if (ok) { needSeek = false; clearInterval(guardTimer); guardTimer = null; return; }
        tries++;
        try { a.currentTime = savedPos; } catch (e) {}
      }, 400);
    }
    a.addEventListener('playing', startSeekGuard);
    a.addEventListener('seeked', function () {
      if (needSeek && Math.abs(a.currentTime - savedPos) < 3) needSeek = false;
    });
    a.addEventListener('timeupdate', function () {
      if (!a.paused && Date.now() - lastSave > 1000) savePos();  // 每秒存一次进度
    });
    a.addEventListener('pause', function () { savePos(); sync(); });
    a.addEventListener('play', sync);
    window.addEventListener('pagehide', savePos);                     // 关页/跳页前存
    document.addEventListener('visibilitychange', function () { if (document.hidden) savePos(); });

    if (!paused) {
      // 没被手动暂停过 → 尝试自动播放；被浏览器拦则按钮呼吸提醒点一下
      needSeek = savedPos > 0.5;
      var p = a.play();
      if (p && p.catch) p.catch(function () { toggle.classList.add('needs-you'); sync(); });
    }
    toggle.addEventListener('click', function () {
      if (a.paused) {
        needSeek = savedPos > 0.5 || a.currentTime > 0.5;
        seekTries = 0;
        localStorage.removeItem(K.paused);
        toggle.classList.remove('needs-you');
        a.play().catch(sync);
      } else {
        localStorage.setItem(K.paused, '1');
        a.pause();
      }
      sync();
    });
    nextBtn.addEventListener('click', function () {
      savePos();
      loadTrack(idx + 1, false);   // 下一首（当前只有一首 → 从头重播）
      if (localStorage.getItem(K.paused) !== '1') { a.play().catch(sync); } else { sync(); }
    });
    volEl.addEventListener('input', function () {
      a.volume = parseFloat(volEl.value);
      localStorage.setItem(K.vol, String(a.volume));
    });
    sync();
  })();
  </script>
